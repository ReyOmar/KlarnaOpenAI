# Blueprint de Render (https://render.com/docs/blueprint-spec)
# Crea la base de datos PostgreSQL y un único servicio web que sirve API + frontend.
# En Render: New → Blueprint → selecciona este repositorio.

databases:
  - name: klarna-openai-db
    plan: free
    databaseName: klarna_openai
    user: klarna

services:
  - type: web
    name: klarna-openai
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: klarna-openai-db
          property: connectionString
      # Terra (consultas complejas) con Gemini y Luna (simples) con Groq;
      # cada proveedor sirve de respaldo automático del otro.
      - key: AI_PROVIDER_TERRA
        value: gemini
      - key: AI_PROVIDER_LUNA
        value: groq
      - key: GEMINI_API_KEY
        sync: false # Render la pide al crear el Blueprint
      - key: GROQ_API_KEY
        sync: false
